.ph{
  --bg:#F6F5F3; --card:#FFFFFF; --ink:#121317; --ink2:#3A3B42; --dim:#75747E; --line:#EAE7E3;
  --btn:#16161B; --new:#6A3BE8; --newbg:#F1EBFE; --newline:#D9C9FB;
  --ok:#0E9F6E; --okbg:#E9FAF3; --bad:#DC2F2F; --badbg:#FDF1F1; --shaky:#C4841F;
  --r:20px;
  --sh1:0 1px 2px rgba(18,19,23,.05);
  --sh2:0 2px 4px rgba(18,19,23,.04),0 14px 30px -16px rgba(18,19,23,.24);
  --sh3:0 4px 10px rgba(18,19,23,.06),0 28px 56px -24px rgba(18,19,23,.4);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",sans-serif;
  font-family:var(--ui); color:var(--ink); background:var(--bg);
  max-width:480px; margin:0 auto; min-height:100vh; position:relative;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.ph *,.ph *::before,.ph *::after{box-sizing:border-box}
.ph button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ph input,.ph textarea,.ph select{font:inherit;color:inherit}
.ph p{margin:0}
.ph svg{display:block}

/* chrome */
.ph-head{position:sticky;top:0;z-index:30;background:rgba(246,245,243,.82);backdrop-filter:saturate(180%) blur(16px);
  display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:60px}
.ph-back{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;
  box-shadow:var(--sh1);flex:none;transition:transform .12s}
.ph-back:active{transform:scale(.94)}
.ph-title{font-size:15.5px;font-weight:600;letter-spacing:-.015em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-body{padding:2px 18px 140px}

.ph-card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh2)}
.ph-h1{font-size:31px;line-height:1.1;font-weight:700;letter-spacing:-.035em;margin:0}
.ph-h2{font-size:20px;font-weight:650;letter-spacing:-.024em;margin:0}
.ph-lab{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.ph-dim{color:var(--dim);font-size:14.5px;line-height:1.5}

/* hero */
.ph-hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;color:#fff;
  background:radial-gradient(120% 100% at 100% 0%,#3A2465 0%,#1E1A33 45%,#141420 100%);box-shadow:var(--sh3)}
.ph-hero::after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(138,92,246,.5),transparent 68%)}
.ph-hero > *{position:relative;z-index:1}
.ph-hero .n{font-size:52px;font-weight:700;letter-spacing:-.05em;line-height:1;margin:2px 0 14px}
.ph-hero .lab{font-size:11px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;opacity:.6}
.ph-heroin{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff;
  border-radius:14px;padding:14px 16px;font-size:15.5px;outline:none}
.ph-heroin::placeholder{color:rgba(255,255,255,.45)}
.ph-heroin:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.15)}
.ph-herobtn{width:100%;margin-top:10px;background:#fff;color:#141420;border-radius:14px;padding:15px;
  font-size:16px;font-weight:650;letter-spacing:-.015em;display:flex;align-items:center;justify-content:center;gap:9px;
  transition:transform .12s}
.ph-herobtn:active{transform:scale(.985)}
.ph-herobtn:disabled{opacity:.55}

/* buttons */
.ph-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--btn);color:#fff;
  border-radius:15px;padding:15px;font-size:16px;font-weight:600;letter-spacing:-.015em;transition:transform .12s,opacity .12s}
.ph-btn:active{transform:scale(.985)}
.ph-btn:disabled{opacity:.32}
.ph-btn.sec{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.ph-btn.sm{padding:10px 15px;font-size:14.5px;width:auto;border-radius:12px}
.ph-in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:15px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.ph-in:focus{border-color:var(--new);box-shadow:0 0 0 3px var(--newbg)}
.ph-row{display:flex;gap:10px;align-items:center}

/* stats */
.ph-stat{flex:1;background:var(--card);border-radius:16px;padding:14px 13px;text-align:left;box-shadow:var(--sh1);transition:transform .12s}
.ph-stat:active{transform:scale(.97)}
.ph-stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.ph-stat span{display:block;font-size:11.5px;color:var(--dim);margin-top:3px;font-weight:500}
.ph-tile{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:18px;padding:16px 18px;
  text-align:left;box-shadow:var(--sh1);transition:transform .12s}
.ph-tile:active{transform:scale(.985)}
.ph-ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}

/* generation progress */
.ph-steps{margin-top:16px;display:grid;gap:2px}
.ph-step{display:flex;align-items:center;gap:11px;padding:8px 0;font-size:14.5px;color:var(--dim);transition:color .3s}
.ph-step.on{color:#fff;font-weight:550}
.ph-step.was{color:rgba(255,255,255,.5)}
.ph-bullet{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center;flex:none}
.ph-step.on .ph-bullet{border-color:#fff}
.ph-step.was .ph-bullet{border-color:transparent;background:rgba(255,255,255,.22)}

/* reading */
.ph-read{font-size:19.5px;line-height:1.72;letter-spacing:-.003em;color:var(--ink)}
.ph-read p{margin:0 0 20px}
.ph-pn{font-size:10.5px;font-weight:700;color:#C3C0BB;margin-right:8px;vertical-align:2.5px;letter-spacing:.04em}
.tok{border-radius:4px;padding:0 .5px;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.tok:active{background:#EFEDEA}
.mark .t-new{color:var(--new);font-weight:560;text-decoration:underline;text-decoration-style:dotted;
  text-decoration-color:var(--newline);text-underline-offset:3.5px;text-decoration-thickness:1.5px}
.ph-read p.saying{background:var(--newbg);border-radius:12px;box-shadow:0 0 0 8px var(--newbg)}
.ph-pp{float:right;margin:3px 0 0 10px;width:28px;height:28px;border-radius:50%;background:#F0EEEB;color:var(--dim);
  display:grid;place-items:center}

/* listen bar */
.ph-listen{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:18px;padding:12px 14px;
  box-shadow:var(--sh1);margin-bottom:22px}
.ph-play{width:42px;height:42px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none;transition:transform .12s}
.ph-play:active{transform:scale(.92)}
.ph-play.sec{background:#F0EEEB;color:var(--ink)}
.ph-play.sm{width:34px;height:34px}
.ph-rate{font-size:12.5px;font-weight:650;padding:7px 11px;border-radius:99px;background:#F0EEEB;color:var(--ink2);flex:none}

/* meter */
.ph-meter{display:flex;gap:3px;height:6px;border-radius:99px;overflow:hidden;background:#EAE7E3}
.ph-meter i{display:block;height:100%}

/* sheet */
.ph-scrim{position:fixed;inset:0;background:rgba(12,12,16,.42);z-index:40;animation:fade .2s ease both;backdrop-filter:blur(2px)}
.ph-sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:41;
  background:var(--card);border-radius:28px 28px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom));
  box-shadow:0 -16px 50px -20px rgba(12,12,16,.55);animation:up .3s cubic-bezier(.22,1,.36,1) both;max-height:84vh;overflow-y:auto}
.ph-grab{width:38px;height:4px;border-radius:99px;background:#E2DFDA;margin:0 auto 16px}
@keyframes up{from{transform:translate(-50%,101%)}to{transform:translate(-50%,0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* tabs */
.ph-tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:35;
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:9px 14px calc(11px + env(safe-area-inset-bottom));
  background:rgba(246,245,243,.9);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line)}
.ph-tab{padding:8px 4px;border-radius:14px;font-size:11.5px;font-weight:600;color:var(--dim);
  display:grid;gap:4px;justify-items:center;transition:background .18s,color .18s}
.ph-tab.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}

.ph-flip{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.22,1,.36,1);transform-style:preserve-3d}
.ph-flip.on{transform:rotateY(180deg)}
.ph-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border-radius:26px;padding:28px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:13px;box-shadow:var(--sh3)}
.ph-face.b{transform:rotateY(180deg);background:linear-gradient(170deg,#FFFFFF,#FAF8FF)}
.ph-word{font-size:32px;font-weight:700;letter-spacing:-.04em;color:var(--new);line-height:1.1}
.ph-dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px}
.ph-dots i{height:4px;flex:1;max-width:34px;border-radius:99px;background:#E4E1DC;transition:background .3s}
.ph-dots i.on{background:var(--new)}
.ph-dots i.done{background:var(--ok)}

/* quiz */
.ph-bar{height:5px;background:#E7E4E0;border-radius:99px;overflow:hidden;margin:4px 0 22px}
.ph-bar i{display:block;height:100%;background:var(--btn);border-radius:99px;transition:width .4s cubic-bezier(.22,1,.36,1)}
.ph-opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;
  padding:16px;margin-bottom:10px;font-size:16px;box-shadow:inset 0 0 0 1.5px var(--line);transition:transform .1s,box-shadow .15s,background .15s}
.ph-opt:active{transform:scale(.99)}
.ph-opt.pick{box-shadow:inset 0 0 0 2px var(--btn)}
.ph-opt.right{box-shadow:inset 0 0 0 2px var(--ok);background:var(--okbg)}
.ph-opt.wrong{box-shadow:inset 0 0 0 2px var(--bad);background:var(--badbg)}
.ph-optm{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.ph-fb{border-radius:16px;padding:15px 17px;font-size:14.5px;line-height:1.5;margin-top:6px}
.ph-fb.ok{background:var(--okbg);color:#07603F}
.ph-fb.no{background:var(--badbg);color:#8C1F1F}
.ph-cloze{font-size:19px;line-height:1.62;font-weight:500;letter-spacing:-.012em}
.ph-gap{display:inline-block;min-width:76px;border-bottom:2.5px solid var(--new);text-align:center;color:var(--new);font-weight:650}
.ph-forma{margin-top:14px;font-size:13.5px;color:#4F3E86;background:var(--newbg);border-radius:12px;padding:10px 13px;font-weight:500}

/* results */
.ph-ringwrap{position:relative;width:132px;height:132px;margin:8px auto 4px}
.ph-ringtx{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:700;letter-spacing:-.04em}
.ph-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:99px;background:#F0EEEB;color:var(--dim)}
.ph-item{display:flex;gap:13px;align-items:center;padding:14px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ph-list{max-height:56vh;overflow-y:auto;margin:0 -20px;padding:0 20px}
.ph-lrow{display:flex;gap:10px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.ph-lrow b{font-weight:600;font-size:15.5px}
.ph-lrow span{color:var(--dim);font-size:13.5px;flex:1}
.ph-delta{display:flex;gap:12px;align-items:baseline;padding:13px 0;border-top:1px solid var(--line)}
.ph-delta b{font-size:22px;font-weight:700;letter-spacing:-.03em;min-width:44px}
.ph-seg{display:flex;gap:5px;background:#F0EEEB;border-radius:14px;padding:4px}
.ph-seg button{flex:1;padding:10px 6px;border-radius:11px;font-size:13.5px;font-weight:600;color:var(--dim);transition:background .18s,color .18s}
.ph-seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}

.ph-spin{display:inline-block;width:16px;height:16px;border-radius:99px;border:2px solid rgba(0,0,0,.12);border-top-color:currentColor;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ph-fadein{animation:fi .38s cubic-bezier(.22,1,.36,1) both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.ph *{animation:none!important;transition:none!important}}
